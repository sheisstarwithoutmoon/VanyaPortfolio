name: Update Portfolio from Resume

on:
  push:
    paths:
      - 'public/resume.pdf'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse resume into structured portfolio data
        run: npm run parse:resume

      - name: Validate generated portfolio data and build site
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy static export to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy ./out --prod --token "$VERCEL_TOKEN"